name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.11 python -m unittest discover -s tests -v
      - run: uvx ruff check scripts tests
      - run: uvx ruff format --check scripts tests
      - run: uv run --python 3.11 python scripts/audit_publication.py
